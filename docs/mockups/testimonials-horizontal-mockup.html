<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials Layout (mockup)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    /* Proposed layout change: centered flex row instead of CSS grid.
       Same 960px max width, 28px gap, and column breakpoints as today. */
    .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; container-type: inline-size; }
    .video-card { flex: 0 0 100%; }
    @container (min-width: 548px) { .video-card { flex-basis: calc((100% - 28px) / 2); } }
    @container (min-width: 836px) { .video-card { flex-basis: calc((100% - 56px) / 3); } }
    .video-grid .video-card--wide { flex-basis: 100%; }
    .video-card--wide iframe { aspect-ratio: 16 / 9; }

    .mock-note { position: sticky; top: 0; z-index: 10; background: #310055; color: #f0d68a; text-align: center; padding: 8px 16px; font: 13px Montserrat, sans-serif; }
    .mock-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #d4af37; color: #0d0d2b; font: 600 11px Montserrat, sans-serif; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="mock-note">MOCKUP — the real Testimonials section, plus a new horizontal video and one new vertical video at the end.</div>
  <!-- Testimonials Section -->
  <section class="testimonials-section" id="testimonials">
    <div class="container">
      <h2 class="section-title">Testimonials</h2>
      <p class="section-subtitle">Stories of healing and transformation</p>

      <div class="video-grid">
        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/QSdwNfF6Klg"
                  title="Hip Healing" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Hip Healing</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/InJeLhX9bsc"
                  title="A Baby&rsquo;s Rash" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>A Baby&rsquo;s Rash</figcaption>
          <button type="button" class="chat-link" data-chat-src="../../testimonials/baby-rash-chat.png"
                  aria-haspopup="dialog">
            <span aria-hidden="true">&#128241;</span> Read the messages
          </button>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/dokFscbLtQI"
                  title="A Neighbor&rsquo;s Story" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>A Neighbor&rsquo;s Story</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/kWsm3VR1BkY"
                  title="Multiple Healings with Mari" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Multiple Healings with Mari</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/taas9tyKrhI"
                  title="Maria&rsquo;s Toe" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Maria&rsquo;s Toe</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame bilingual-video"
                  src="https://www.youtube-nocookie.com/embed/81-TSDf7Hkw"
                  title="Janet" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                  data-en="https://www.youtube-nocookie.com/embed/81-TSDf7Hkw"
                  data-es="https://www.youtube-nocookie.com/embed/IlA3SaP2M50"></iframe>
          <div class="lang-toggle" role="group" aria-label="Choose video language">
            <span class="lang-toggle__slider" aria-hidden="true"></span>
            <button type="button" class="lang-toggle__btn is-active" data-lang="en" aria-pressed="true">English</button>
            <button type="button" class="lang-toggle__btn" data-lang="es" aria-pressed="false">Español</button>
          </div>
          <figcaption>Janet</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame bilingual-video"
                  src="https://www.youtube-nocookie.com/embed/UteLo90dJp4"
                  title="Andy" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                  data-en="https://www.youtube-nocookie.com/embed/UteLo90dJp4"
                  data-es="https://www.youtube-nocookie.com/embed/i75OAU3NfSk"></iframe>
          <div class="lang-toggle" role="group" aria-label="Choose video language">
            <span class="lang-toggle__slider" aria-hidden="true"></span>
            <button type="button" class="lang-toggle__btn is-active" data-lang="en" aria-pressed="true">English</button>
            <button type="button" class="lang-toggle__btn" data-lang="es" aria-pressed="false">Español</button>
          </div>
          <figcaption>Andy</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/Ff7bHdkLALk"
                  title="Max Feels It" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Max Feels It</figcaption>
        </figure>

        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/3_R41WpsVxA"
                  title="Michelle&rsquo;s Healing" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Michelle&rsquo;s Healing</figcaption>
        </figure>

        <!-- MOCKUP: new horizontal video added from the admin -->
        <figure class="video-card video-card--wide">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ"
                  title="Sample horizontal video" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Sample Horizontal Video <span class="mock-tag">NEW · horizontal</span></figcaption>
        </figure>

        <!-- MOCKUP: one more new vertical video, alone on the last row -->
        <figure class="video-card">
          <iframe class="video-card__frame" src="https://www.youtube-nocookie.com/embed/QSdwNfF6Klg"
                  title="Another new vertical video" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
          <figcaption>Another New Video <span class="mock-tag">NEW · vertical</span></figcaption>
        </figure>
      </div>

      <!-- Letters sub-section: a stacked deck that opens a carousel lightbox -->
      <div class="letters-block">
        <h3 class="letters-title">Notes of gratitude, in their own words</h3>
        <p class="letters-subtitle">Tap to read</p>
        <div class="letters-deck" id="lettersDeck" role="button" tabindex="0"
             aria-label="Open letters of gratitude">
          <img class="letter-card" style="--i:0" src="../../testimonials/text/82947.jpg"
               alt="Letter from Rebecca Marino confirming a herniated disc healed remotely" loading="lazy">
          <img class="letter-card" style="--i:1" src="../../testimonials/text/brook-letter.png"
               alt="Email from Brook describing relief from chronic elbow pain" loading="lazy">
          <img class="letter-card" style="--i:2" src="../../testimonials/text/cousin.png"
               alt="Testimonial from Goddess's cousin describing pain relief after a fall" loading="lazy">
          <img class="letter-card" style="--i:3" src="../../testimonials/text/marcia-wade.png"
               alt="Letter from Marcia Wade recounting how chronic ear pain healed" loading="lazy">
          <img class="letter-card" style="--i:4" src="../../testimonials/text/mannie.png"
               alt="Letter from Mannie sharing gratitude for healing" loading="lazy">
          <span class="letters-deck__hint" aria-hidden="true">Read the letters</span>
        </div>
      </div>
    </div>
  </section>


  <script src="../../script.js"></script>
</body>
</html>
