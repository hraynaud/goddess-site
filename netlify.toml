# Netlify configuration for T.O.U.C.H. The World
#
# Netlify runs ./build-site.sh, which assembles the public site into ./site,
# then serves that folder. A push to the connected branch triggers a fresh
# build and deploy automatically — no manual zip upload needed.
#
# Serverless functions (the Stripe → Zoom automation) live in ./netlify/functions
# and deploy alongside the site on this branch. Secrets are set in the Netlify
# dashboard (Site settings → Environment variables), never committed here.
# See zoom-automation-setup.md.

[build]
  command = "./build-site.sh"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
